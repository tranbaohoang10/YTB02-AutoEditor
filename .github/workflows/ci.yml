name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Python 3.12 tests
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight test dependencies
        run: python -m pip install "Pillow>=11,<12" "numpy>=2.1,<3" "opencv-python-headless>=4.10,<5"

      - name: Install FFmpeg for real FINAL concat smoke test
        run: choco install ffmpeg -y --no-progress

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate lightweight dependency contract
        run: python -m unittest discover -s tests -p "test_dependency_contract.py" -v

      - name: Compile Python sources
        run: python -m compileall -q src tests
